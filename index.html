<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Retroalimentación</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --naranja: #f97316;
            --naranja-oscuro: #ea580c;
            --naranja-suave: #fff7ed;
            --naranja-borde: #fed7aa;
            --blanco: #ffffff;
            --fondo: #fffaf5;
            --texto: #1f2937;
            --texto-suave: #6b7280;
            --borde: #e5e7eb;
            --azul: #2563eb;

            --verde-fila: #ecfdf5;
            --verde-borde: #a7f3d0;
            --verde-texto: #065f46;
            --verde-card-bg: #f0fdf4;
            --verde-card-border: #86efac;

            --rojo-fila: #fef2f2;
            --rojo-borde: #fecaca;
            --rojo-texto: #991b1b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 24px 16px;
        }

        .contenedor-principal {
            max-width: 1150px;
            margin: 0 auto;
            background-color: var(--blanco);
            border: 1px solid var(--naranja-borde);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.08);
        }

        h2 {
            margin: 0 0 20px 0;
            color: var(--naranja-oscuro);
            font-size: 1.7rem;
            border-bottom: 3px solid var(--naranja);
            padding-bottom: 10px;
            display: inline-block;
        }

        h3 {
            margin: 0 0 14px 0;
            color: var(--texto);
            font-size: 1.3rem;
        }

        h4 {
            margin: 20px 0 10px 0;
            color: var(--naranja-oscuro);
            font-size: 1.05rem;
        }

        .barra-controles {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background-color: var(--naranja-suave);
            border: 1px solid var(--naranja-borde);
            padding: 16px;
            border-radius: 10px;
        }

        select {
            padding: 10px 14px;
            font-size: 15px;
            border: 1.5px solid var(--naranja-borde);
            border-radius: 8px;
            background-color: var(--blanco);
            color: var(--texto);
            min-width: 190px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            border-color: var(--naranja);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
        }

        select:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: var(--naranja);
            color: var(--blanco);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--naranja-oscuro);
        }

        button:active {
            transform: scale(0.99);
        }

        .btn-secundario {
            background-color: var(--blanco);
            color: var(--naranja-oscuro);
            border: 1.5px solid var(--naranja);
        }

        .btn-secundario:hover {
            background-color: var(--naranja-suave);
            color: var(--naranja-oscuro);
        }

        .encabezado-resultados {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .area-superior-resultados {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 20px;
        }

        #evolucion-container {
            flex: 1 1 560px;
            min-width: 0;
        }

        #score-final-container:not(:empty) {
            flex: 0 0 240px;
            display: flex;
        }

        .evolucion-box {
            width: 100%;
            background-color: var(--naranja-suave);
            border: 1px solid var(--naranja-borde);
            border-left: 5px solid var(--naranja);
            padding: 18px 20px;
            border-radius: 10px;
        }

        .score-final-box {
            width: 100%;
            background-color: var(--verde-card-bg);
            border: 1px solid var(--verde-card-border);
            border-left: 5px solid var(--verde-texto);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 12px rgba(6, 95, 70, 0.08);
        }

        .score-final-box h4 {
            margin: 0 0 10px 0;
            color: var(--verde-texto);
            font-size: 1rem;
        }

        .score-valor {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--verde-texto);
            margin: 6px 0;
        }

        .score-sub {
            font-size: 13px;
            color: #047857;
            font-weight: 600;
        }

        .evolucion-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .evolucion-header h4 {
            margin: 0;
        }

        .leyenda-evolucion {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 13px;
            color: var(--texto);
        }

        .leyenda-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .punto-leyenda-naranja {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--naranja-oscuro);
            display: inline-block;
        }

        .punto-leyenda-azul {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--azul);
            border: 2px solid var(--blanco);
            box-shadow: 0 0 0 1px var(--azul);
            display: inline-block;
        }

        .svg-evolucion-wrapper {
            width: 100%;
            background-color: var(--blanco);
            border: 1px solid var(--naranja-borde);
            border-radius: 8px;
            padding: 10px;
            overflow-x: auto;
        }

        .svg-evolucion {
            width: 100%;
            min-width: 460px;
            height: 230px;
            display: block;
        }

        .punto-grafica {
            cursor: pointer;
            transition: r 0.2s, fill 0.2s;
        }
        .punto-grafica:hover {
            r: 8.5px;
            fill: var(--azul);
        }
        .elemento-clicable {
            cursor: pointer;
        }

        .selector-simulacro {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 12px 14px;
            background-color: var(--naranja-suave);
            border-radius: 8px;
            border: 1px solid var(--naranja-borde);
        }

        .selector-simulacro label {
            font-weight: 600;
            color: var(--naranja-oscuro);
        }

        .resumen-box {
            background-color: var(--naranja-suave);
            border: 1px solid var(--naranja-borde);
            border-left: 5px solid var(--naranja);
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .contenedor-graficos {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-around;
            align-items: flex-end;
        }

        .bloque-grafico {
            flex: 1;
            min-width: 260px;
            background: var(--blanco);
            border: 1px solid var(--naranja-borde);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .bloque-grafico h5 {
            margin: 0 0 15px 0;
            color: var(--naranja-oscuro);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container-vertical {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 160px;
            border-bottom: 2px solid var(--naranja);
            padding: 0 10px;
            gap: 20px;
        }

        .barra-vertical-grupo {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
        }

        .valor-barra {
            font-size: 12px;
            font-weight: 700;
            color: var(--texto);
            margin-bottom: 4px;
        }

        .columna-barra-fondo {
            width: 36px;
            height: 120px;
            background-color: #f3f4f6;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            border: 1px solid var(--borde);
        }

        .columna-barra-progreso {
            width: 100%;
            background: linear-gradient(180deg, var(--naranja), var(--naranja-oscuro));
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease-in-out;
        }

        .etiqueta-barra {
            font-size: 13px;
            font-weight: 600;
            color: var(--texto);
            margin-top: 6px;
        }

        .tabla-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--naranja-borde);
            box-shadow: 0 2px 10px rgba(249, 115, 22, 0.05);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 720px;
            background-color: var(--blanco);
        }

        th {
            background-color: var(--naranja);
            color: var(--blanco);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        td {
            padding: 11px 14px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            vertical-align: top;
        }

        tr.fila-acierto {
            background-color: var(--verde-fila);
        }

        tr.fila-acierto:hover {
            background-color: #d1fae5;
        }

        tr.fila-error {
            background-color: var(--rojo-fila);
        }

        tr.fila-error:hover {
            background-color: #fee2e2;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-si {
            background-color: var(--verde-borde);
            color: var(--verde-texto);
        }

        .badge-no {
            background-color: var(--rojo-borde);
            color: var(--rojo-texto);
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <h2>Consulta de Retroalimentación</h2>

        <!-- Selectores -->
        <div id="seccion-seleccion" class="barra-controles">
            <select id="selectSemestre" onchange="cargarGrupos()">
                <option value="">Cargando semestres...</option>
            </select>

            <select id="selectGrupo" onchange="cargarEstudiantes()" disabled>
                <option value="">Selecciona un semestre</option>
            </select>

            <select id="selectEstudiante" disabled>
                <option value="">Selecciona un grupo</option>
            </select>

            <button onclick="consultarDatos()">Ver Retroalimentación</button>
        </div>

        <!-- Resultados -->
        <div id="seccion-resultados" class="oculto">
            <div class="encabezado-resultados">
                <h3 id="tituloEstudiante"></h3>
                <button class="btn-secundario" onclick="volver()">← Volver</button>
            </div>

            <!-- Área superior: Gráfica de evolución + Recuadro Score Final (2025-1) -->
            <div class="area-superior-resultados">
                <div id="evolucion-container"></div>
                <div id="score-final-container"></div>
            </div>

            <div class="selector-simulacro">
                <label for="selectSimulacro">Selecciona el simulacro:</label>
                <select id="selectSimulacro" onchange="seleccionarSimulacroDesdeUI()">
                    <option value="">Selecciona un simulacro</option>
                </select>
            </div>

            <div id="tabla-container"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzOoEEx8eXsnbW-lUros3DhpF4ZkAxM93WAf5HdMjbXsDinZ28FLks8q4cha7-TGyjy/exec";
        let datosGlobales = null;
        let evolucionEstudiante = [];
        let scoreFinalEstudiante = null;

        function esSemestre2025_1(semestre) {
            const limpio = String(semestre || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            return limpio === "20251" || limpio.includes("20251");
        }

        window.onload = async () => {
            try {
                const res = await fetch(`${API_URL}?action=semestres`);
                const semestres = await res.json();
                const select = document.getElementById('selectSemestre');
                select.innerHTML = '<option value="">Selecciona un semestre</option>';
                semestres.forEach(s => select.innerHTML += `<option value="${escaparHTML(s)}">${escaparHTML(s)}</option>`);
            } catch (e) {
                alert("Error cargando semestres");
            }
        };

        async function cargarGrupos() {
            const semestre = document.getElementById('selectSemestre').value;
            const selectGrupo = document.getElementById('selectGrupo');
            const selectEst = document.getElementById('selectEstudiante');
            selectEst.innerHTML = '<option value="">Selecciona un grupo</option>';
            selectEst.disabled = true;

            if (!semestre) {
                selectGrupo.innerHTML = '<option value="">Selecciona semestre</option>';
                selectGrupo.disabled = true;
                return;
            }

            selectGrupo.innerHTML = '<option value="">Cargando...</option>';
            selectGrupo.disabled = false;

            try {
                const res = await fetch(`${API_URL}?action=grupos&semestre=${encodeURIComponent(semestre)}`);
                const grupos = await res.json();
                selectGrupo.innerHTML = '<option value="">Selecciona un grupo</option>';
                grupos.forEach(g => selectGrupo.innerHTML += `<option value="${escaparHTML(g)}">${escaparHTML(g)}</option>`);
            } catch (e) { selectGrupo.innerHTML = '<option value="">Error</option>'; }
        }

        async function cargarEstudiantes() {
            const semestre = document.getElementById('selectSemestre').value;
            const grupo = document.getElementById('selectGrupo').value;
            const selectEst = document.getElementById('selectEstudiante');

            if (!grupo) {
                selectEst.innerHTML = '<option value="">Selecciona un grupo</option>';
                selectEst.disabled = true;
                return;
            }

            selectEst.innerHTML = '<option value="">Cargando...</option>';
            selectEst.disabled = false;

            try {
                const res = await fetch(`${API_URL}?action=estudiantes&semestre=${encodeURIComponent(semestre)}&grupo=${encodeURIComponent(grupo)}`);
                const estudiantes = await res.json();
                selectEst.innerHTML = '<option value="">Selecciona un estudiante</option>';
                estudiantes.sort().forEach(e => selectEst.innerHTML += `<option value="${escaparHTML(e)}">${escaparHTML(e)}</option>`);
            } catch (e) { selectEst.innerHTML = '<option value="">Error</option>'; }
        }

        function calcularAciertosCsv(csvTexto) {
            let aciertos = 0;
            Papa.parse(csvTexto, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    results.data.forEach(fila => {
                        if (String(fila['¿Acertó?'] || '').trim().toUpperCase() === 'TRUE') {
                            aciertos++;
                        }
                    });
                }
            });
            return aciertos;
        }

        async function consultarDatos() {
            const semestre = document.getElementById('selectSemestre').value;
            const grupo = document.getElementById('selectGrupo').value;
            const estudiante = document.getElementById('selectEstudiante').value;

            if (!semestre || !grupo || !estudiante) {
                alert("Selecciona todas las opciones.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}?action=datos&semestre=${encodeURIComponent(semestre)}&grupo=${encodeURIComponent(grupo)}&estudiante=${encodeURIComponent(estudiante)}`);
                datosGlobales = await res.json();

                if (datosGlobales.error) {
                    alert(datosGlobales.error);
                    return;
                }

                evolucionEstudiante = (datosGlobales.simulacros || []).map(sim => ({
                    num: sim.num,
                    puntaje: calcularAciertosCsv(sim.csv)
                }));

                scoreFinalEstudiante = datosGlobales.scoreFinal !== undefined ? datosGlobales.scoreFinal : null;

                document.getElementById('seccion-seleccion').classList.add('oculto');
                document.getElementById('seccion-resultados').classList.remove('oculto');
                document.getElementById('tituloEstudiante').innerText = `Resultados: ${estudiante}`;

                const selectSim = document.getElementById('selectSimulacro');
                selectSim.innerHTML = '<option value="">Selecciona un simulacro</option>';
                datosGlobales.simulacros.forEach(sim => {
                    selectSim.innerHTML += `<option value="${sim.num}">Simulacro ${sim.num}</option>`;
                });

                document.getElementById('tabla-container').innerHTML = "";
                renderizarGraficaEvolucion(null);
                renderizarScoreFinal();
            } catch (e) {
                alert("Error al conectar");
                console.error(e);
            }
        }

        function renderizarScoreFinal() {
            const scoreContainer = document.getElementById('score-final-container');
            const semestre = document.getElementById('selectSemestre').value.trim();

            if (esSemestre2025_1(semestre)) {
                const textoScore = (scoreFinalEstudiante !== null && String(scoreFinalEstudiante).trim() !== "")
                    ? escaparHTML(scoreFinalEstudiante)
                    : "Sin registro";

                scoreContainer.innerHTML = `
                    <div class="score-final-box">
                        <h4>Examen Admisión UdeA</h4>
                        <div class="score-valor">${textoScore}</div>
                        <div class="score-sub">SCORE_FINAL (${escaparHTML(semestre)})</div>
                    </div>
                `;
            } else {
                scoreContainer.innerHTML = "";
            }
        }

        function renderizarGraficaEvolucion(simulacroSeleccionadoNum) {
            const evolContainer = document.getElementById('evolucion-container');

            if (!evolucionEstudiante || evolucionEstudiante.length === 0) {
                evolContainer.innerHTML = `
                    <div class="evolucion-box">
                        <h4>Evolución del Estudiante</h4>
                        <p style="margin:0; color: var(--texto-suave);">No hay simulacros registrados para este estudiante.</p>
                    </div>
                `;
                return;
            }

            const width = 640;
            const height = 230;
            const padLeft = 48;
            const padRight = 24;
            const padTop = 18;
            const padBottom = 38;

            const plotWidth = width - padLeft - padRight;
            const plotHeight = height - padTop - padBottom;
            const maxPuntaje = 80;

            const getY = (puntaje) => {
                const clamped = Math.max(0, Math.min(maxPuntaje, puntaje));
                return padTop + plotHeight - (clamped / maxPuntaje) * plotHeight;
            };

            const getX = (index, total) => {
                if (total === 1) return padLeft + plotWidth / 2;
                return padLeft + (index / (total - 1)) * plotWidth;
            };

            const ticksY = [0, 20, 40, 60, 80];
            let gridLines = "";
            ticksY.forEach(val => {
                const y = getY(val);
                gridLines += `
                    <line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="#fed7aa" stroke-dasharray="${val === 0 ? 'none' : '4,4'}" stroke-width="1" />
                    <text x="${padLeft - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#6b7280" font-weight="600">${val}</text>
                `;
            });

            const puntosCoords = evolucionEstudiante.map((item, idx) => ({
                x: getX(idx, evolucionEstudiante.length),
                y: getY(item.puntaje),
                num: item.num,
                puntaje: item.puntaje
            }));

            let polylinePoints = puntosCoords.map(p => `${p.x},${p.y}`).join(" ");
            let lineaEvolucion = puntosCoords.length > 1
                ? `<polyline fill="none" stroke="#f97316" stroke-width="3" points="${polylinePoints}" />`
                : "";

            let elementosPuntos = "";
            puntosCoords.forEach(p => {
                const esSeleccionado = simulacroSeleccionadoNum !== null && String(p.num) === String(simulacroSeleccionadoNum);
                const colorPunto = esSeleccionado ? "#2563eb" : "#ea580c";
                const radioPunto = esSeleccionado ? 7.5 : 5;

                elementosPuntos += `
                    <g class="elemento-clicable" onclick="seleccionarSimulacroPorNumero(${p.num})">
                        <line x1="${p.x}" y1="${padTop}" x2="${p.x}" y2="${padTop + plotHeight}" stroke="transparent" stroke-width="16" />
                        <circle class="punto-grafica" cx="${p.x}" cy="${p.y}" r="${radioPunto}" fill="${colorPunto}" stroke="#ffffff" stroke-width="2">
                            <title>Simulacro ${p.num}: ${p.puntaje}/80</title>
                        </circle>
                        <text x="${p.x}" y="${p.y - (esSeleccionado ? 12 : 9)}" text-anchor="middle" font-size="11" font-weight="700" fill="${esSeleccionado ? '#2563eb' : '#1f2937'}">${p.puntaje}</text>
                        <text x="${p.x}" y="${height - 10}" text-anchor="middle" font-size="11" font-weight="${esSeleccionado ? '700' : '600'}" fill="${esSeleccionado ? '#2563eb' : '#1f2937'}">Sim. ${p.num}</text>
                    </g>
                `;
            });

            evolContainer.innerHTML = `
                <div class="evolucion-box">
                    <div class="evolucion-header">
                        <h4>Evolución (0 - 80)</h4>
                        <div class="leyenda-evolucion">
                            <span class="leyenda-item"><span class="punto-leyenda-naranja"></span> Realizados</span>
                            <span class="leyenda-item"><span class="punto-leyenda-azul"></span> Seleccionado</span>
                        </div>
                    </div>
                    <div class="svg-evolucion-wrapper">
                        <svg class="svg-evolucion" viewBox="0 0 ${width} ${height}" role="img" aria-label="Evolución">
                            <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${padTop + plotHeight}" stroke="#ea580c" stroke-width="2" />
                            <line x1="${padLeft}" y1="${padTop + plotHeight}" x2="${width - padRight}" y2="${padTop + plotHeight}" stroke="#ea580c" stroke-width="2" />
                            <text x="14" y="${padTop + plotHeight / 2}" text-anchor="middle" font-size="11" font-weight="700" fill="#ea580c" transform="rotate(-90, 14, ${padTop + plotHeight / 2})">Puntaje</text>

                            ${gridLines}
                            ${lineaEvolucion}
                            ${elementosPuntos}
                        </svg>
                    </div>
                </div>
            `;
        }

        function seleccionarSimulacroDesdeUI() {
            const numSim = document.getElementById('selectSimulacro').value;
            mostrarSimulacroSeleccionadoLogica(numSim);
        }

        function seleccionarSimulacroPorNumero(num) {
            const selectSim = document.getElementById('selectSimulacro');
            selectSim.value = num;
            mostrarSimulacroSeleccionadoLogica(num);
        }

        function mostrarSimulacroSeleccionadoLogica(numSim) {
            const container = document.getElementById('tabla-container');
            renderizarGraficaEvolucion(numSim ? numSim : null);

            if (!numSim) {
                container.innerHTML = "";
                return;
            }

            const simEncontrado = datosGlobales.simulacros.find(s => s.num == numSim);
            if (!simEncontrado) return;

            Papa.parse(simEncontrado.csv, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const datos = results.data;

                    const stats = {
                        CL: { aciertos: 0, total: 0 },
                        RL: { aciertos: 0, total: 0 }
                    };
                    let totalAciertos = 0;
                    let totalPreguntas = 0;

                    datos.forEach(fila => {
                        const area = (fila['Área'] || '').trim().toUpperCase();
                        const acerto = String(fila['¿Acertó?'] || '').trim().toUpperCase() === 'TRUE';

                        if (area) {
                            if (!stats[area]) {
                                stats[area] = { aciertos: 0, total: 0 };
                            }
                            stats[area].total++;
                            if (acerto) stats[area].aciertos++;
                        }

                        totalPreguntas++;
                        if (acerto) totalAciertos++;
                    });

                    const pctCL = stats.CL.total > 0 ? ((stats.CL.aciertos / stats.CL.total) * 100).toFixed(1) : "0.0";
                    const pctRL = stats.RL.total > 0 ? ((stats.RL.aciertos / stats.RL.total) * 100).toFixed(1) : "0.0";
                    const pctTotal = totalPreguntas > 0 ? ((totalAciertos / totalPreguntas) * 100).toFixed(1) : "0.0";

                    let htmlResumen = `<h4>Resumen de Aciertos - Simulacro ${numSim}</h4>`;
                    htmlResumen += `<div class="resumen-box">`;
                    htmlResumen += `<div class="contenedor-graficos">`;

                    htmlResumen += `
                        <div class="bloque-grafico">
                            <h5>Áreas Específicas (Sobre 40)</h5>
                            <div class="chart-container-vertical">
                                <div class="barra-vertical-grupo">
                                    <span class="valor-barra">${stats.CL.aciertos}/40<br>(${pctCL}%)</span>
                                    <div class="columna-barra-fondo">
                                        <div class="columna-barra-progreso" style="height: ${pctCL}%;"></div>
                                    </div>
                                    <span class="etiqueta-barra">CL</span>
                                </div>
                                <div class="barra-vertical-grupo">
                                    <span class="valor-barra">${stats.RL.aciertos}/40<br>(${pctRL}%)</span>
                                    <div class="columna-barra-fondo">
                                        <div class="columna-barra-progreso" style="height: ${pctRL}%;"></div>
                                    </div>
                                    <span class="etiqueta-barra">RL</span>
                                </div>
                            </div>
                        </div>
                    `;

                    htmlResumen += `
                        <div class="bloque-grafico">
                            <h5>Total General (Sobre 80)</h5>
                            <div class="chart-container-vertical">
                                <div class="barra-vertical-grupo">
                                    <span class="valor-barra">${totalAciertos}/80<br>(${pctTotal}%)</span>
                                    <div class="columna-barra-fondo">
                                        <div class="columna-barra-progreso" style="height: ${pctTotal}%;"></div>
                                    </div>
                                    <span class="etiqueta-barra">Total</span>
                                </div>
                            </div>
                        </div>
                    `;

                    htmlResumen += `</div></div>`;

                    let htmlTabla = `<h4>Detalle de Preguntas</h4>`;
                    htmlTabla += `<div class="tabla-wrapper"><table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Área</th>
                                <th>Nivel</th>
                                <th>Respuesta</th>
                                <th>Correcta</th>
                                <th>¿Acertó?</th>
                                <th>Solucionario</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    datos.forEach(fila => {
                        const acerto = String(fila['¿Acertó?'] || '').trim().toUpperCase() === 'TRUE';
                        const solucionario = fila['Solucionario'] || '';
                        const claseFila = acerto ? 'fila-acierto' : 'fila-error';
                        const badge = acerto
                            ? `<span class="badge badge-si">Sí</span>`
                            : `<span class="badge badge-no">No</span>`;

                        htmlTabla += `<tr class="${claseFila}">
                            <td>${escaparHTML(fila['# Pregunta'])}</td>
                            <td>${escaparHTML(fila['Área'])}</td>
                            <td>${escaparHTML(fila['Nivel'])}</td>
                            <td>${escaparHTML(fila['Respuesta del estudiante'])}</td>
                            <td>${escaparHTML(fila['Opción Correcta'])}</td>
                            <td>${badge}</td>
                            <td>${escaparHTML(solucionario)}</td>
                        </tr>`;
                    });

                    htmlTabla += `</tbody></table></div>`;
                    container.innerHTML = htmlResumen + htmlTabla;
                }
            });
        }

        function escaparHTML(texto) {
            const limpio = String(texto || '').trim();
            if (!limpio) return '-';
            return limpio
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function volver() {
            document.getElementById('seccion-resultados').classList.add('oculto');
            document.getElementById('seccion-seleccion').classList.remove('oculto');
            document.getElementById('selectEstudiante').value = '';
            document.getElementById('selectSimulacro').value = '';
            document.getElementById('evolucion-container').innerHTML = "";
            document.getElementById('score-final-container').innerHTML = "";
            document.getElementById('tabla-container').innerHTML = "";
            evolucionEstudiante = [];
            scoreFinalEstudiante = null;
        }
    </script>
</body>
</html>
