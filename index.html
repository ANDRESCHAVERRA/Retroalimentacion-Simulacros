<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Retroalimentación</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --naranja: #f97316;
            --naranja-oscuro: #ea580c;
            --naranja-suave: #fff7ed;
            --naranja-borde: #fed7aa;
            --blanco: #ffffff;
            --fondo: #fffaf5;
            --texto: #1f2937;
            --texto-suave: #6b7280;
            --borde: #e5e7eb;

            --verde-fila: #ecfdf5;
            --verde-borde: #a7f3d0;
            --verde-texto: #065f46;

            --rojo-fila: #fef2f2;
            --rojo-borde: #fecaca;
            --rojo-texto: #991b1b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            margin: 0;
            padding: 24px 16px;
        }

        .contenedor-principal {
            max-width: 1150px;
            margin: 0 auto;
            background-color: var(--blanco);
            border: 1px solid var(--naranja-borde);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.08);
        }

        h2 {
            margin: 0 0 20px 0;
            color: var(--naranja-oscuro);
            font-size: 1.7rem;
            border-bottom: 3px solid var(--naranja);
            padding-bottom: 10px;
            display: inline-block;
        }

        h3 {
            margin: 0 0 14px 0;
            color: var(--texto);
            font-size: 1.3rem;
        }

        h4 {
            margin: 20px 0 10px 0;
            color: var(--naranja-oscuro);
            font-size: 1.05rem;
        }

        .barra-controles {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background-color: var(--naranja-suave);
            border: 1px solid var(--naranja-borde);
            padding: 16px;
            border-radius: 10px;
        }

        select {
            padding: 10px 14px;
            font-size: 15px;
            border: 1.5px solid var(--naranja-borde);
            border-radius: 8px;
            background-color: var(--blanco);
            color: var(--texto);
            min-width: 190px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            border-color: var(--naranja);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
        }

        select:disabled {
            background-color: #f3f4f6;
            color: #9ca3af;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: var(--naranja);
            color: var(--blanco);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--naranja-oscuro);
        }

        button:active {
            transform: scale(0.99);
        }

        .btn-secundario {
            background-color: var(--blanco);
            color: var(--naranja-oscuro);
            border: 1.5px solid var(--naranja);
        }

        .btn-secundario:hover {
            background-color: var(--naranja-suave);
            color: var(--naranja-oscuro);
        }

        .encabezado-resultados {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .selector-simulacro {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 12px 14px;
            background-color: var(--naranja-suave);
            border-radius: 8px;
            border: 1px solid var(--naranja-borde);
        }

        .selector-simulacro label {
            font-weight: 600;
            color: var(--naranja-oscuro);
        }

        /* Estilos de la caja de resumen y gráficos verticales */
        .resumen-box {
            background-color: var(--naranja-suave);
            border: 1px solid var(--naranja-borde);
            border-left: 5px solid var(--naranja);
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .contenedor-graficos {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: space-around;
            align-items: flex-end;
        }

        .bloque-grafico {
            flex: 1;
            min-width: 260px;
            background: var(--blanco);
            border: 1px solid var(--naranja-borde);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .bloque-grafico h5 {
            margin: 0 0 15px 0;
            color: var(--naranja-oscuro);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container-vertical {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 160px;
            border-bottom: 2px solid var(--naranja);
            padding: 0 10px;
            gap: 20px;
        }

        .barra-vertical-grupo {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
        }

        .valor-barra {
            font-size: 12px;
            font-weight: 700;
            color: var(--texto);
            margin-bottom: 4px;
        }

        .columna-barra-fondo {
            width: 36px;
            height: 120px;
            background-color: #f3f4f6;
            border-radius: 6px 6px 0 0;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
            border: 1px solid var(--borde);
        }

        .columna-barra-progreso {
            width: 100%;
            background: linear-gradient(180deg, var(--naranja), var(--naranja-oscuro));
            border-radius: 4px 4px 0 0;
            transition: height 0.6s ease-in-out;
        }

        .etiqueta-barra {
            font-size: 13px;
            font-weight: 600;
            color: var(--texto);
            margin-top: 6px;
        }

        .tabla-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--naranja-borde);
            box-shadow: 0 2px 10px rgba(249, 115, 22, 0.05);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 720px;
            background-color: var(--blanco);
        }

        th {
            background-color: var(--naranja);
            color: var(--blanco);
            font-weight: 600;
            padding: 12px 14px;
            text-align: left;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        td {
            padding: 11px 14px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            vertical-align: top;
        }

        tr.fila-acierto {
            background-color: var(--verde-fila);
        }

        tr.fila-acierto:hover {
            background-color: #d1fae5;
        }

        tr.fila-error {
            background-color: var(--rojo-fila);
        }

        tr.fila-error:hover {
            background-color: #fee2e2;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .badge-si {
            background-color: var(--verde-borde);
            color: var(--verde-texto);
        }

        .badge-no {
            background-color: var(--rojo-borde);
            color: var(--rojo-texto);
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <h2>Consulta de Retroalimentación</h2>

        <!-- Selectores -->
        <div id="seccion-seleccion" class="barra-controles">
            <select id="selectSemestre" onchange="cargarGrupos()">
                <option value="">Cargando semestres...</option>
            </select>

            <select id="selectGrupo" onchange="cargarEstudiantes()" disabled>
                <option value="">Selecciona un semestre</option>
            </select>

            <select id="selectEstudiante" disabled>
                <option value="">Selecciona un grupo</option>
            </select>

            <button onclick="consultarDatos()">Ver Retroalimentación</button>
        </div>

        <!-- Resultados -->
        <div id="seccion-resultados" class="oculto">
            <div class="encabezado-resultados">
                <h3 id="tituloEstudiante"></h3>
                <button class="btn-secundario" onclick="volver()">← Volver</button>
            </div>

            <div class="selector-simulacro">
                <label for="selectSimulacro">Selecciona el simulacro:</label>
                <select id="selectSimulacro" onchange="mostrarSimulacroSeleccionado()">
                    <option value="">Selecciona un simulacro</option>
                </select>
            </div>

            <div id="tabla-container"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzOoEEx8eXsnbW-lUros3DhpF4ZkAxM93WAf5HdMjbXsDinZ28FLks8q4cha7-TGyjy/exec";
        let datosGlobales = null;

        window.onload = async () => {
            try {
                const res = await fetch(`${API_URL}?action=semestres`);
                const semestres = await res.json();
                const select = document.getElementById('selectSemestre');
                select.innerHTML = '<option value="">Selecciona un semestre</option>';
                semestres.forEach(s => select.innerHTML += `<option value="${escaparHTML(s)}">${escaparHTML(s)}</option>`);
            } catch (e) {
                alert("Error cargando semestres");
            }
        };

        async function cargarGrupos() {
            const semestre = document.getElementById('selectSemestre').value;
            const selectGrupo = document.getElementById('selectGrupo');
            const selectEst = document.getElementById('selectEstudiante');
            selectEst.innerHTML = '<option value="">Selecciona un grupo</option>';
            selectEst.disabled = true;

            if (!semestre) {
                selectGrupo.innerHTML = '<option value="">Selecciona semestre</option>';
                selectGrupo.disabled = true;
                return;
            }

            selectGrupo.innerHTML = '<option value="">Cargando...</option>';
            selectGrupo.disabled = false;

            try {
                const res = await fetch(`${API_URL}?action=grupos&semestre=${encodeURIComponent(semestre)}`);
                const grupos = await res.json();
                selectGrupo.innerHTML = '<option value="">Selecciona un grupo</option>';
                grupos.forEach(g => selectGrupo.innerHTML += `<option value="${escaparHTML(g)}">${escaparHTML(g)}</option>`);
            } catch (e) {
                selectGrupo.innerHTML = '<option value="">Error</option>';
            }
        }

        async function cargarEstudiantes() {
            const semestre = document.getElementById('selectSemestre').value;
            const grupo = document.getElementById('selectGrupo').value;
            const selectEst = document.getElementById('selectEstudiante');

            if (!grupo) {
                selectEst.innerHTML = '<option value="">Selecciona un grupo</option>';
                selectEst.disabled = true;
                return;
            }

            selectEst.innerHTML = '<option value="">Cargando...</option>';
            selectEst.disabled = false;

            try {
                const res = await fetch(`${API_URL}?action=estudiantes&semestre=${encodeURIComponent(semestre)}&grupo=${encodeURIComponent(grupo)}`);
                const estudiantes = await res.json();
                selectEst.innerHTML = '<option value="">Selecciona un estudiante</option>';
                estudiantes.sort().forEach(e => selectEst.innerHTML += `<option value="${escaparHTML(e)}">${escaparHTML(e)}</option>`);
            } catch (e) {
                selectEst.innerHTML = '<option value="">Error</option>';
            }
        }

        async function consultarDatos() {
            const semestre = document.getElementById('selectSemestre').value;
            const grupo = document.getElementById('selectGrupo').value;
            const estudiante = document.getElementById('selectEstudiante').value;

            if (!semestre || !grupo || !estudiante) {
                alert("Selecciona todas las opciones.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}?action=datos&semestre=${encodeURIComponent(semestre)}&grupo=${encodeURIComponent(grupo)}&estudiante=${encodeURIComponent(estudiante)}`);
                datosGlobales = await res.json();

                if (datosGlobales.error) {
                    alert(datosGlobales.error);
                    return;
                }

                document.getElementById('seccion-seleccion').classList.add('oculto');
                document.getElementById('seccion-resultados').classList.remove('oculto');
                document.getElementById('tituloEstudiante').innerText = `Resultados: ${estudiante}`;

                const selectSim = document.getElementById('selectSimulacro');
                selectSim.innerHTML = '<option value="">Selecciona un simulacro</option>';
                datosGlobales.simulacros.forEach(sim => {
                    selectSim.innerHTML += `<option value="${sim.num}">Simulacro ${sim.num}</option>`;
                });

                document.getElementById('tabla-container').innerHTML = "";
            } catch (e) {
                alert("Error al conectar");
                console.error(e);
            }
        }

        function mostrarSimulacroSeleccionado() {
            const numSim = document.getElementById('selectSimulacro').value;
            const container = document.getElementById('tabla-container');

            if (!numSim) {
                container.innerHTML = "";
                return;
            }

            const simEncontrado = datosGlobales.simulacros.find(s => s.num == numSim);

            Papa.parse(simEncontrado.csv, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const datos = results.data;

                    const stats = {
                        CL: { aciertos: 0, total: 0 },
                        RL: { aciertos: 0, total: 0 }
                    };
                    let totalAciertos = 0;
                    let totalPreguntas = 0;

                    datos.forEach(fila => {
                        const area = (fila['Área'] || '').trim().toUpperCase();
                        const acerto = String(fila['¿Acertó?'] || '').trim().toUpperCase() === 'TRUE';

                        if (area) {
                            if (!stats[area]) {
                                stats[area] = { aciertos: 0, total: 0 };
                            }
                            stats[area].total++;
                            if (acerto) stats[area].aciertos++;
                        }

                        totalPreguntas++;
                        if (acerto) totalAciertos++;
                    });

                    // Cálculo de porcentajes para las alturas de las barras verticales
                    const pctCL = stats.CL.total > 0 ? ((stats.CL.aciertos / stats.CL.total) * 100).toFixed(1) : "0.0";
                    const pctRL = stats.RL.total > 0 ? ((stats.RL.aciertos / stats.RL.total) * 100).toFixed(1) : "0.0";
                    const pctTotal = totalPreguntas > 0 ? ((totalAciertos / totalPreguntas) * 100).toFixed(1) : "0.0";

                    let htmlResumen = `<h4>Resumen de Aciertos - Simulacro ${numSim}</h4>`;
                    htmlResumen += `<div class="resumen-box">`;
                    htmlResumen += `<div class="contenedor-graficos">`;

                    // Gráfico 1: CL y RL (Sobre 40 cada uno)
                    htmlResumen += `
                        <div class="bloque-grafico">
                            <h5>Áreas Específicas (Sobre 40)</h5>
                            <div class="chart-container-vertical">
                                <div class="barra-vertical-grupo">
                                    <span class="valor-barra">${stats.CL.aciertos}/40<br>(${pctCL}%)</span>
                                    <div class="columna-barra-fondo">
                                        <div class="columna-barra-progreso" style="height: ${pctCL}%;"></div>
                                    </div>
                                    <span class="etiqueta-barra">CL</span>
                                </div>
                                <div class="barra-vertical-grupo">
                                    <span class="valor-barra">${stats.RL.aciertos}/40<br>(${pctRL}%)</span>
                                    <div class="columna-barra-fondo">
                                        <div class="columna-barra-progreso" style="height: ${pctRL}%;"></div>
                                    </div>
                                    <span class="etiqueta-barra">RL</span>
                                </div>
                            </div>
                        </div>
                    `;

                    // Gráfico 2: Total General (Sobre 80)
                    htmlResumen += `
                        <div class="bloque-grafico">
                            <h5>Total General (Sobre 80)</h5>
                            <div class="chart-container-vertical">
                                <div class="barra-vertical-grupo">
                                    <span class="valor-barra">${totalAciertos}/80<br>(${pctTotal}%)</span>
                                    <div class="columna-barra-fondo">
                                        <div class="columna-barra-progreso" style="height: ${pctTotal}%;"></div>
                                    </div>
                                    <span class="etiqueta-barra">Total</span>
                                </div>
                            </div>
                        </div>
                    `;

                    htmlResumen += `</div></div>`;

                    let htmlTabla = `<h4>Detalle de Preguntas</h4>`;
                    htmlTabla += `<div class="tabla-wrapper"><table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Área</th>
                                <th>Nivel</th>
                                <th>Respuesta</th>
                                <th>Correcta</th>
                                <th>¿Acertó?</th>
                                <th>Solucionario</th>
                            </tr>
                        </thead>
                        <tbody>`;

                    datos.forEach(fila => {
                        const acerto = String(fila['¿Acertó?'] || '').trim().toUpperCase() === 'TRUE';
                        const solucionario = fila['Solucionario'] || '';
                        const claseFila = acerto ? 'fila-acierto' : 'fila-error';
                        const badge = acerto
                            ? `<span class="badge badge-si">Sí</span>`
                            : `<span class="badge badge-no">No</span>`;

                        htmlTabla += `<tr class="${claseFila}">
                            <td>${escaparHTML(fila['# Pregunta'])}</td>
                            <td>${escaparHTML(fila['Área'])}</td>
                            <td>${escaparHTML(fila['Nivel'])}</td>
                            <td>${escaparHTML(fila['Respuesta del estudiante'])}</td>
                            <td>${escaparHTML(fila['Opción Correcta'])}</td>
                            <td>${badge}</td>
                            <td>${escaparHTML(solucionario)}</td>
                        </tr>`;
                    });

                    htmlTabla += `</tbody></table></div>`;
                    container.innerHTML = htmlResumen + htmlTabla;
                }
            });
        }

        function escaparHTML(texto) {
            const limpio = String(texto || '').trim();
            if (!limpio) return '-';
            return limpio
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function volver() {
            document.getElementById('seccion-resultados').classList.add('oculto');
            document.getElementById('seccion-seleccion').classList.remove('oculto');
            document.getElementById('selectEstudiante').value = '';
            document.getElementById('selectSimulacro').value = '';
            document.getElementById('tabla-container').innerHTML = "";
        }
    </script>
</body>
</html>
